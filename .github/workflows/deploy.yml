name: Deploy App to GitHub Pages
on:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Fix SPA routers for subpath
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          # React Router — createBrowserRouter
          find src -type f \( -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" -o -name "*.js" \) 2>/dev/null | xargs grep -l "createBrowserRouter" 2>/dev/null | while read file; do
            sed -i "s|createBrowserRouter(|createBrowserRouter(/* patched */ |g" "$file"
            sed -i "s|)\s*;|, { basename: \x27/${REPO_NAME}/\x27 });|" "$file"
          done || true
          # React Router — <BrowserRouter>
          find src -type f \( -name "*.tsx" -o -name "*.jsx" -o -name "*.ts" -o -name "*.js" \) 2>/dev/null | xargs grep -l "<BrowserRouter" 2>/dev/null | while read file; do
            sed -i "s|<BrowserRouter|<BrowserRouter basename=\x22/${REPO_NAME}/\x22|g" "$file"
          done || true
          # Vue Router — createRouter history base
          find src -type f \( -name "*.ts" -o -name "*.js" \) 2>/dev/null | xargs grep -l "createWebHistory" 2>/dev/null | while read file; do
            sed -i "s|createWebHistory()|createWebHistory(\x27/${REPO_NAME}/\x27)|g" "$file"
            sed -i "s|createWebHistory(import.meta.env.BASE_URL)|createWebHistory(\x27/${REPO_NAME}/\x27)|g" "$file"
          done || true
      - name: Configure and Build
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          # Angular
          if grep -q '"@angular/core"' package.json; then
            npx ng build --base-href /${REPO_NAME}/
            PROJECT=$(ls dist/ | head -1)
            if [ -d "dist/${PROJECT}/browser" ]; then echo "PUB_DIR=./dist/${PROJECT}/browser" >> $GITHUB_ENV
            elif [ -d "dist/${PROJECT}" ]; then echo "PUB_DIR=./dist/${PROJECT}" >> $GITHUB_ENV
            else echo "PUB_DIR=./dist" >> $GITHUB_ENV; fi
          # Vite (React/Vue/Svelte)
          elif grep -q '"vite"' package.json; then
            npm run build -- --base=/${REPO_NAME}/
            echo "PUB_DIR=./dist" >> $GITHUB_ENV
          # Create React App
          elif grep -q '"react-scripts"' package.json; then
            jq ".homepage = \"https://${REPO_OWNER}.github.io/${REPO_NAME}\"" package.json > tmp.json && mv tmp.json package.json
            npm run build
            echo "PUB_DIR=./build" >> $GITHUB_ENV
          # Vue CLI
          elif grep -q '"@vue/cli-service"' package.json; then
            echo "module.exports = { publicPath: \x27/${REPO_NAME}/\x27 }" > vue.config.js
            npm run build
            echo "PUB_DIR=./dist" >> $GITHUB_ENV
          # Fallback
          else
            npm run build
            echo "PUB_DIR=./dist" >> $GITHUB_ENV
          fi
      - name: Fix SPA routing
        run: |
          if [ -f "${{ env.PUB_DIR }}/index.html" ]; then
            cp ${{ env.PUB_DIR }}/index.html ${{ env.PUB_DIR }}/404.html
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUB_DIR }}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4